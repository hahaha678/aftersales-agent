spring:
  application:
    name: aftersales-agent
  profiles:
    default: scaffold
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
  sql:
    init:
      mode: never

springdoc:
  paths-to-match: /api/**
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: false

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
