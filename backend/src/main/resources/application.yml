spring:
    servlet:
        multipart:
            max-file-size: 5MB
            max-request-size: 6MB
    application:
        name: aftersales-agent
    profiles:
        default: scaffold
    flyway:
        locations: classpath:db/migration
        clean-disabled: true
        baseline-on-migrate: false
    sql:
        init:
            mode: never

mybatis:
    mapper-locations: classpath*:mapper/**/*.xml
    configuration:
        map-underscore-to-camel-case: true
        cache-enabled: false
        local-cache-scope: STATEMENT
        default-statement-timeout: 5
        # 避免 DEBUG 日志打印密码摘要、会话摘要等 SQL 参数。
        log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

springdoc:
    paths-to-match: /api/**
    override-with-generic-response: false
    swagger-ui:
        path: /swagger-ui.html
        operations-sorter: method
        tags-sorter: alpha
        persist-authorization: false

app:
    knowledge:
        provider: ${EMBEDDING_PROVIDER:disabled}
        base-url: ${EMBEDDING_BASE_URL:http://127.0.0.1:11434}
        model: ${EMBEDDING_MODEL:}
        api-key: ${EMBEDDING_API_KEY:}
        min-score: ${KNOWLEDGE_MIN_SCORE:0.65}
        hybrid-search: ${KNOWLEDGE_HYBRID_SEARCH:true}
    agent:
        enabled: ${AI_ENABLED:false}
        api-key: ${DEEPSEEK_API_KEY:}
        model: ${DEEPSEEK_MODEL:deepseek-flash}
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}

server:
    address: ${SERVER_ADDRESS:127.0.0.1}
    port: ${SERVER_PORT:8080}
    shutdown: graceful
    error:
        include-message: never
        include-stacktrace: never

management:
    health:
        redis:
            enabled: ${app.auth.cache.enabled:false}
    endpoints:
        web:
            exposure:
                include: health,info
    endpoint:
        health:
            show-details: never
